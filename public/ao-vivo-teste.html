<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Simulador da live · O Motta Não.</title>
<!-- Simula a tela da live sem OBS: câmera (ou foto) em 16:9 com o contador por cima, como na transmissão. -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0b0f; color: #fff; font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px; }
  .tela { position: relative; width: min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px -20px #000; }
  .tela video, .tela .foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tela video { transform: scaleX(-1); }
  .tela .foto { background: url('/luiz-960.webp') center 25% / cover no-repeat; filter: saturate(.9); }
  /* o contador é renderizado em 1920x1080 e reduzido para caber, igual à fonte de navegador do OBS */
  .camada { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; background: transparent; }
  .selo { position: absolute; left: 14px; top: 12px; display: flex; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
    background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 8px; }
  .selo i { width: 9px; height: 9px; border-radius: 50%; background: #ff3b3b; }
  .controles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .controles button { font: inherit; font-weight: 700; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #fff; padding: 9px 14px; border-radius: 999px; cursor: pointer; }
  .controles button[aria-pressed="true"] { background: #1f4fe0; border-color: #1f4fe0; }
  .dica { font-size: 13px; color: rgba(255,255,255,.55); text-align: center; max-width: 720px; }
</style>
</head>
<body>
  <div class="tela" id="tela">
    <div class="foto" id="foto"></div>
    <video id="video" autoplay muted playsinline></video>
    <iframe class="camada" id="camada" title="Contador" allowtransparency="true"></iframe>
    <div class="selo"><i></i>Simulação da live</div>
  </div>

  <div class="controles">
    <button type="button" data-estilo="bloco" aria-pressed="true">Bloco</button>
    <button type="button" data-estilo="faixa" aria-pressed="false">Faixa</button>
    <button type="button" id="b-demo" aria-pressed="false">Ensaio (número subindo)</button>
    <button type="button" id="b-cam" aria-pressed="false">Usar câmera</button>
    <button type="button" id="b-tela">Tela cheia</button>
  </div>
  <p class="dica">Esta página só simula como o contador fica sobre a transmissão. Sem o “Ensaio”, o número é o total real de assinaturas, atualizado a cada 3 segundos. Nada aqui vai ao ar.</p>

<script>
(function () {
  var estilo = 'bloco', demo = false
  var camada = document.getElementById('camada'), tela = document.getElementById('tela')
  function atualizar() {
    camada.src = '/ao-vivo?estilo=' + estilo + (demo ? '&demo=1' : '') + '&t=' + Date.now()
    document.querySelectorAll('[data-estilo]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.estilo === estilo)) })
    document.getElementById('b-demo').setAttribute('aria-pressed', String(demo))
  }
  function encaixar() { camada.style.transform = 'scale(' + tela.clientWidth / 1920 + ')' }
  document.querySelectorAll('[data-estilo]').forEach(function (b) { b.onclick = function () { estilo = b.dataset.estilo; atualizar() } })
  document.getElementById('b-demo').onclick = function () { demo = !demo; atualizar() }
  document.getElementById('b-tela').onclick = function () { (tela.requestFullscreen || tela.webkitRequestFullscreen || function () {}).call(tela) }
  var cam = document.getElementById('b-cam')
  cam.onclick = function () {
    var v = document.getElementById('video')
    if (v.srcObject) { v.srcObject.getTracks().forEach(function (t) { t.stop() }); v.srcObject = null; cam.setAttribute('aria-pressed', 'false'); return }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('Este navegador não deixa usar a câmera aqui. A foto fica no lugar.'); return }
    navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false })
      .then(function (s) { v.srcObject = s; cam.setAttribute('aria-pressed', 'true') })
      .catch(function () { alert('A câmera não foi liberada. A foto fica no lugar.') })
  }
  new ResizeObserver(encaixar).observe(tela)
  addEventListener('resize', encaixar)
  encaixar()
  atualizar()
})()
</script>
</body>
</html>
